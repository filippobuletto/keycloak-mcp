name: Release

# Builds a release from a tag v<version> that matches the pom version: multi-arch images on GHCR and a draft
# GitHub Release with the JVM app, the native binaries and SHA256SUMS. The maintainer publishes the draft.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/filippobuletto/keycloak-mcp

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - id: version
        name: Check the tag against the pom version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(./mvnw -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the pom version $version (expected tag v$version)"
            exit 1
          fi
          case "$version" in
            *-SNAPSHOT) echo "::error::pom version $version is a snapshot"; exit 1 ;;
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
      # Unit tests, ITs on the jar, the coverage gate and the formatter check
      - run: ./mvnw -B verify

  build:
    needs: check
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # One run gives target/quarkus-app and the native binary, then runs the ITs against the binary
      - name: Build the jar and the native binary
        run: ./mvnw -B verify -Dnative -Dquarkus.package.jar.enabled=true -Dtest=NoSuchTest -Dsurefire.failIfNoSpecifiedTests=false
      - name: Collect the release assets
        run: |
          mkdir dist
          cp "target/keycloak-mcp-$VERSION-runner" "dist/keycloak-mcp-$VERSION-linux-$ARCH"
          if [ "$ARCH" = amd64 ]; then
            (cd target && zip -qr "../dist/keycloak-mcp-$VERSION.zip" quarkus-app)
          fi
          ls -l dist
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build both images
        run: |
          for flavor in jvm native; do
            docker buildx build --load --provenance=false -f "src/main/docker/Dockerfile.$flavor-distroless" \
              -t "keycloak-mcp-scan:$flavor" --metadata-file "scan-$flavor.json" .
          done
      - name: Scan both images
        run: TRIVY_IMAGES="keycloak-mcp-scan:jvm keycloak-mcp-scan:native" docker/trivy-scan.sh
      - name: Show the scan verdicts
        if: failure()
        run: cat target/trivy/*.verdict.txt || true
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Rebuilds from the builder cache and pushes without a tag; the config digest check proves the pushed image
      # is the scanned one
      - name: Push both images by digest
        run: |
          mkdir digests
          for flavor in jvm native; do
            docker buildx build --provenance=false -f "src/main/docker/Dockerfile.$flavor-distroless" \
              --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
              --metadata-file "meta-$flavor.json" .
            scanned=$(jq -r '."containerimage.config.digest"' "scan-$flavor.json")
            pushed=$(jq -r '."containerimage.config.digest"' "meta-$flavor.json")
            if [ "$scanned" != "$pushed" ]; then
              echo "::error::$flavor image config $pushed differs from the scanned $scanned"
              exit 1
            fi
            jq -r '."containerimage.digest"' "meta-$flavor.json" > "digests/$flavor-$ARCH"
          done
          cat digests/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.arch }}
          path: digests
          if-no-files-found: error
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets-${{ matrix.arch }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [check, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      PRERELEASE: ${{ needs.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          path: digests
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: assets-*
          path: dist
          merge-multiple: true
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the multi-arch tags
        run: |
          # tag_flavor <flavor> <description> <tag>...: one index over the amd64 and arm64 digests of a flavor
          tag_flavor() {
            flavor=$1 description=$2
            shift 2
            sources=""
            for arch in amd64 arm64; do
              sources="$sources $IMAGE@$(cat "digests/$flavor-$arch")"
            done
            tags=""
            for tag in "$@"; do
              tags="$tags -t $IMAGE:$tag"
            done
            # shellcheck disable=SC2086 # word splitting of the tag and source lists is intended
            docker buildx imagetools create $tags \
              --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --annotation "index:org.opencontainers.image.description=$description" \
              --annotation "index:org.opencontainers.image.licenses=EUPL-1.2" \
              $sources
            docker buildx imagetools inspect "$IMAGE:$1"
          }
          tag_flavor jvm "MCP server for the Keycloak Admin API (JVM, distroless)" "$VERSION"
          if [ "$PRERELEASE" = true ]; then
            tag_flavor native "MCP server for the Keycloak Admin API (native, distroless)" "$VERSION-native"
          else
            tag_flavor native "MCP server for the Keycloak Admin API (native, distroless)" "$VERSION-native" latest
          fi
      # A pre-release takes the section of its release version: v0.1.0-rc.1 uses ## [0.1.0]
      - name: Write the release notes
        run: |
          section=${VERSION%%-*}
          awk -v v="$section" '
            /^## \[/ { if (p) exit; if (index($0, "## [" v "]") == 1) { p = 1; next } }
            p
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section ## [$section]"
            exit 1
          fi
          cat notes.md
      - name: Write SHA256SUMS
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" --draft --verify-tag --title "v$VERSION" --notes-file notes.md \
            --prerelease="$PRERELEASE" --latest="$([ "$PRERELEASE" = true ] && echo false || echo true)" \
            dist/*
