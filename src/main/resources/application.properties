quarkus.application.name=keycloak-mcp

# Validation messages reach MCP clients; keep them independent of the host locale
quarkus.default-locale=en-US

# MCP transports: HTTP by default (dev, test, http); stdio profile switches to stdio
quarkus.mcp.server.server-info.name=keycloak-mcp
# One tools/list page: the server has more tools than the default page size of 50
quarkus.mcp.server.tools.page-size=0
quarkus.mcp.server.stdio.enabled=false
%stdio.quarkus.mcp.server.stdio.enabled=true
%stdio.quarkus.http.host-enabled=false
%http.quarkus.mcp.server.stdio.enabled=false

# Target Keycloak; dev and test use Dev Services
keycloak-mcp.keycloak-url=${KEYCLOAK_URL}
%dev,test.keycloak-mcp.keycloak-url=${quarkus.keycloak.admin-client.server-url}
# stdio's own admin identity; over HTTP (prod, http) the server acts only as the signed-in user and has none
%stdio.quarkus.keycloak.admin-client.server-url=${KEYCLOAK_URL}
%stdio.quarkus.keycloak.admin-client.realm=${KEYCLOAK_AUTH_REALM:master}
%stdio.quarkus.keycloak.admin-client.client-id=${KEYCLOAK_CLIENT_ID:admin-cli}
%stdio.quarkus.keycloak.admin-client.client-secret=${KEYCLOAK_CLIENT_SECRET:}
%stdio.quarkus.keycloak.admin-client.username=${KEYCLOAK_USERNAME:}
%stdio.quarkus.keycloak.admin-client.password=${KEYCLOAK_PASSWORD:}
%stdio.quarkus.keycloak.admin-client.grant-type=${KEYCLOAK_GRANT_TYPE:PASSWORD}

quarkus.keycloak.devservices.image-name=quay.io/keycloak/keycloak:26.8.2
# The first realm names the issuer: master exists already, so Dev Services skip it and the tests load its objects
# (MasterFixture, as docker/seed-master.sh does for compose); acme is the target data
quarkus.keycloak.devservices.realm-path=docker/master.json,docker/realms/acme.json
quarkus.keycloak.devservices.realm-name=master

# HTTP transport: /mcp needs a bearer token from the issuer realm with the mcp-admin role
quarkus.http.auth.permission.mcp.paths=/mcp,/mcp/*
quarkus.http.auth.permission.mcp.policy=mcp-admin
quarkus.http.auth.policy.mcp-admin.roles-allowed=${MCP_OIDC_ROLE:mcp-admin}
%prod,http.quarkus.oidc.auth-server-url=${MCP_OIDC_URL:${KEYCLOAK_URL}/realms/master}
quarkus.oidc.client-id=keycloak-mcp
quarkus.oidc.token.audience=${MCP_OIDC_AUDIENCE:keycloak-mcp-server}
quarkus.oidc.token.allow-opaque-token-introspection=false
quarkus.oidc.resource-metadata.enabled=true
# The MCP endpoint as clients reach it, e.g. http://localhost:8091/mcp; unset keeps the https server root
quarkus.oidc.resource-metadata.resource=${MCP_PUBLIC_URL:}
# Client scope MCP clients request at sign-in; also named in the 403 insufficient_scope challenge
quarkus.oidc.resource-metadata.scopes=${MCP_OIDC_SCOPE:mcp:tools}
# CORS: browsers may call /mcp only from MCP_CORS_ORIGINS; empty means same-origin only
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${MCP_CORS_ORIGINS:}
quarkus.http.cors.methods=GET,POST,DELETE
quarkus.http.cors.headers=Authorization,Content-Type,Accept,Mcp-Session-Id,MCP-Protocol-Version,Last-Event-ID
quarkus.http.cors.exposed-headers=Mcp-Session-Id,WWW-Authenticate
# Bearer tokens, not cookies: browsers must not send credentials
quarkus.http.cors.access-control-allow-credentials=false
quarkus.http.cors.access-control-max-age=1H
# stdio has no HTTP endpoint; the Keycloak credentials in the environment are the trust boundary
%stdio.quarkus.oidc.tenant-enabled=false

# HTTP calls Keycloak as the signed-in user: the exchange client trades the user's token for an Admin API token
quarkus.oidc-client.auth-server-url=${quarkus.oidc.auth-server-url:}
quarkus.oidc-client.client-id=${MCP_OIDC_CLIENT_ID:keycloak-mcp-server}
quarkus.oidc-client.credentials.secret=${MCP_OIDC_CLIENT_SECRET:}
%dev,test.quarkus.oidc-client.credentials.secret=${MCP_OIDC_CLIENT_SECRET:keycloak-mcp-server-secret}
quarkus.oidc-client.grant.type=exchange
quarkus.oidc-client.grant-options.exchange.requested_token_type=urn:ietf:params:oauth:token-type:access_token
quarkus.oidc-client.scopes=kc-admin-api
%stdio.quarkus.oidc-client.client-enabled=false

# Client secret tools return live credentials; hidden and uncallable unless set to true
keycloak-mcp.client-secrets.enabled=${MCP_CLIENT_SECRETS_ENABLED:false}

# Destructive tools: elicit asks the user through an MCP elicitation; flag trusts confirm=true from the client
keycloak-mcp.confirm.mode=${MCP_CONFIRM_MODE:elicit}
# Tests run in flag mode; ConfirmElicitationTest switches to elicit
%test.keycloak-mcp.confirm.mode=${MCP_CONFIRM_MODE:flag}

# Container image, built locally with -Dquarkus.container-image.build=true; never pushed
quarkus.container-image.registry=ghcr.io
quarkus.container-image.group=filippobuletto

# Native build: the skill files are read from the classpath at startup
quarkus.native.resources.includes=skills/**
